channels:
  - conda-forge
dependencies:
  - cxx-compiler
  - pkg-config
  - libcantera-devel=3.0.0
  - cantera=3.0.0
  - cython
  - meson
  - meson-python
  - ninja
  - pip
  - gtest
  - pytest