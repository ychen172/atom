###Create a new true empty conda environment
# conda create --name myNewEnv --no-default-packages
###Update environment with the following package
# mamba activate myNewEnv
# mamba env update -f environment.yaml

###If later want to nuke the whole environment
# mamba activate otherEnvironment
# mamba env remove -n myNewEnv

